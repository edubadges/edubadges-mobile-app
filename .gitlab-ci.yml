image: docker:20.10
services:
  - docker:20.10-dind

stages:
  - qa

quality:
  image:
    name: sonarsource/sonar-scanner-cli:11.3
    entrypoint: [ "" ]
  stage: qa
  before_script:
    - dnf update
    - dnf install git unzip curl tar gzip bash wget findutils
    - wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.5-stable.tar.xz
    - tar xf flutter_linux_3.38.5-stable.tar.xz -C /opt
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter config --no-analytics
    - flutter --version
    - flutter pub get
  script:
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.pub-cache
  only:
    - merge_requests
    - develop