image: docker:20.10
services:
  - docker:20.10-dind

stages:
  - qa

quality:
  image: sonarsource/sonar-scanner-cli:11.3
  before_script:
    - apt-get update && apt-get install -y curl unzip git
    - curl -LO https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.0-stable.tar.xz
    - tar xf flutter_linux_3.38.0-stable.tar.xz
    - export PATH="$PWD/flutter/bin:$PATH"
    - flutter pub get
  stage: qa
  script:
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  only:
    - merge_requests
    - develop

