image: docker:20.10
services:
  - docker:20.10-dind

stages:
  - qa

quality:
  image:
    name: sonarsource/sonar-scanner-cli:11.3
    entrypoint: [ "" ]
  stage: qa
  before_script:
    # === Diagnostic commands to check the OS and package managers ===
    - echo "=== OS Release Info ==="
    - cat /etc/os-release || echo "No /etc/os-release found"
    - echo "=== Checking common package managers ==="
    - which apk && echo "apk found" || echo "apk NOT found"
    - which apt && echo "apt found" || echo "apt NOT found"
    - which apt-get && echo "apt-get found" || echo "apt-get NOT found"
    - which yum && echo "yum found" || echo "yum NOT found"
    - which dnf && echo "dnf found" || echo "dnf NOT found"
    - which pacman && echo "pacman found" || echo "pacman NOT found"
    # ==============================================================
    - apk update
    - apt-get update
    - yam update
    - dnf update
    - apk add --no-cache git unzip curl bash
    - curl -O https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.24.3-stable.tar.xz
    - tar xf flutter_linux_3.24.3-stable.tar.xz -C /opt
    - echo 'export PATH="$PATH:/opt/flutter/bin"' >> /etc/profile
    - export PATH="$PATH:/opt/flutter/bin"
    - flutter --version
  script:
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.pub-cache
  only:
    - merge_requests
    - develop