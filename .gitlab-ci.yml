image: docker:20.10
services:
  - docker:20.10-dind

stages:
  - qa

quality:
  image:
    name: sonarsource/sonar-scanner-cli:11.3
    entrypoint: [""]
    docker:
      user: root                # Required for dnf
  stage: qa
  before_script:
    # Install required packages: xz (extraction) + which (Flutter needs it) + openssh-clients (for ssh-keyscan)
    - dnf install -y xz which openssh-clients

    # Download Flutter using curl (already present)
    - curl -O https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.5-stable.tar.xz

    # Extract
    - tar xf flutter_linux_3.38.5-stable.tar.xz -C /opt

    # Add to PATH
    - export PATH="$PATH:/opt/flutter/bin"

    # Fix Git dubious ownership
    - git config --global --add safe.directory /opt/flutter

    # Add GitLab.com host key to known_hosts (fixes "Host key verification failed")
    - mkdir -p ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts

    # Optional: disable analytics + verify
    - flutter config --no-analytics
    - flutter --version       # Should show Flutter version
  script:
    - flutter pub get
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.pub-cache          # Speeds up pub get massively after first run
  only:
    - merge_requests
    - develop