image: docker:20.10
services:
  - docker:20.10-dind

stages:
  - qa

quality:
  image:
    name: sonarsource/sonar-scanner-cli:11.3
    entrypoint: [""]
    docker:
      user: root                # Required for dnf
  stage: qa
  before_script:
    # Install minimal packages: xz (extraction) + which (for Flutter tools)
    - dnf install -y xz which

    # Download Flutter using curl (already present)
    - curl -O https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.5-stable.tar.xz

    # Extract
    - tar xf flutter_linux_3.38.5-stable.tar.xz -C /opt

    # Add to PATH
    - export PATH="$PATH:/opt/flutter/bin"

    # Fix Git dubious ownership
    - git config --global --add safe.directory /opt/flutter

    # Disable Android SDK check (no Android build needed for pub get or Sonar Dart analysis)
    - flutter config --no-android-sdk

    # Optional: disable analytics + verify
    - flutter config --no-analytics
    - flutter --version       # Should succeed now
  script:
    - flutter pub get
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.pub-cache          # Makes pub get instant after first run
  only:
    - merge_requests
    - develop