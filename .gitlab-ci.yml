image: docker:20.10
services:
  - docker:20.10-dind

stages:
  - qa

quality:
  image:
    name: sonarsource/sonar-scanner-cli:11.3
    entrypoint: [""]
    docker:
      user: root                # Required for dnf
  stage: qa
  before_script:
    # Install required packages: xz (extraction), which (Flutter needs it), openssh-clients (for SSH)
    - dnf install -y xz which openssh-clients

    # Download Flutter using curl (already present)
    - curl -O https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.38.5-stable.tar.xz

    # Extract
    - tar xf flutter_linux_3.38.5-stable.tar.xz -C /opt

    # Add to PATH
    - export PATH="$PATH:/opt/flutter/bin"

    # Fix Git dubious ownership
    - git config --global --add safe.directory /opt/flutter

    # Rewrite SSH git@gitlab.com URLs to HTTPS using the built-in CI job token (automatically grants access to private repos the project can reach)
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf git@gitlab.com:

    # Optional: disable analytics + verify
    - flutter config --no-analytics
    - flutter --version       # Should show Flutter version
  script:
    - flutter pub get
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - ~/.pub-cache          # Makes pub get instant after first run
  only:
    - merge_requests
    - develop