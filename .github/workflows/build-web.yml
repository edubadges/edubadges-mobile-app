name: Build and Deploy Flutter Web

on:
  workflow_dispatch:
    inputs:
      source-branch:
        type: choice
        description: Source branch to build
        options: [develop, test, acceptance, main]

jobs:
  build:
    name: Build web — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-branch }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: "stable"

      - name: Dependencies
        run: flutter pub get

      - name: Determine flavor based on branch
        id: flavor-map
        run: |
          case "${{ inputs.source-branch }}" in
            develop)
              echo "flavor=dev" >> $GITHUB_OUTPUT
              ;;
            test)
              echo "flavor=tst" >> $GITHUB_OUTPUT
              ;;
            acceptance)
              echo "flavor=acc" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "flavor=prod" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Override API URLs per environment
        run: |
          ENV_FILE=".env.${{ steps.flavor-map.outputs.flavor }}"

          # Pick the API_URL for this flavor
          case "${{ steps.flavor-map.outputs.flavor }}" in
            dev)    API_URL="https://api-demo.edubadges.nl/mobile/api" ;;
            tst)    API_URL="https://api-test.edubadges.nl/mobile/api" ;;
            acc)    API_URL="https://api-acc.edubadges.nl/mobile/api" ;;
            prod)   API_URL="https://api.edubadges.nl/mobile/api" ;;
          esac

          sed -i "s|^API_URL=.*|API_URL=$API_URL|" "$ENV_FILE"
          echo "  → $ENV_FILE now reads:"
          grep API_URL "$ENV_FILE"

      - name: Override collection base URLs per environment
        run: |
          ENV_FILE=".env.${{ steps.flavor-map.outputs.flavor }}"

          # Pick the PUBLIC_COLLECTION_BASE_URL for this flavor
          case "${{ steps.flavor-map.outputs.flavor }}" in
            dev)    COLLECTION_URL="https://demo.edubadges.nl/public/collections" ;;
            tst)    COLLECTION_URL="https://test.edubadges.nl/public/collections" ;;
            acc)    COLLECTION_URL="https://acc.edubadges.nl/public/collections" ;;
            prod)   COLLECTION_URL="https://edubadges.nl/public/collections" ;;
          esac

          sed -i "s|^PUBLIC_COLLECTION_BASE_URL=.*|PUBLIC_COLLECTION_BASE_URL=$COLLECTION_URL|" "$ENV_FILE"
          echo "  → $ENV_FILE now reads:"
          grep PUBLIC_COLLECTION_BASE_URL "$ENV_FILE"

      - name: Build web
        run: |
          ./tool/build_web.sh ${{ steps.flavor-map.outputs.flavor }}

      - name: Create tarball
        run: tar -czf web-${{ inputs.source-branch }}.tar.gz -C build/web .

      - name: Upload to target repo
        run: |
          mkdir -p dist/${{ inputs.source-branch }}
          TAG="web-${{ inputs.source-branch }}"
          mv $TAG.tar.gz dist/${{ inputs.source-branch }}/web.tar.gz
          git config --global user.name "github-actions[bot]"
          ADDR="github-actions[bot]@users.noreply.github.com"
          git config --global user.email "$ADDR"
          CLONE_URL="https://${{ secrets.DEPLOY_TOKEN }}@github.com"
          CLONE_URL+="/edubadges/edubadges-backpack-web.git"
          git clone "$CLONE_URL" --depth 1 deploy-repo
          mkdir -p deploy-repo/dist/${{ inputs.source-branch }}
          cp -r dist/* deploy-repo/dist/
          cd deploy-repo
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Build ${{ inputs.source-branch }} ${{ github.sha }}"
          git push
