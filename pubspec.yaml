name: edubadges
description: A Flutter application
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.1
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: any
  dartz: any
  flutter_dotenv: any
  go_router: any
  dio: any
  flutter_svg: any
  flutter_native_splash: any
  firebase_core: any
  firebase_crashlytics: any
  firebase_analytics: any
  flutter_riverpod: any
  logger: any
  shared_preferences: any
  firebase_auth: any
  flutter_appauth: any
  flutter_secure_storage: any
  connectivity_plus: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.4.1
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - .env.dev
    - .env.tst
    - .env.acc
    - .env.prod
    - assets/icons/
    - assets/splash/
    - assets/fonts/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
        - asset: assets/fonts/Nunito-ExtraLight.ttf
          weight: 300
    - family: SourceSans3BlackItalic
      fonts:
        - asset: assets/fonts/SourceSans3-BlackItalic.ttf
          weight: 900
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-Black.ttf
          weight: 900
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-ExtraLight.ttf
          weight: 300
        - asset: assets/fonts/SourceSans3-Light.ttf
          weight: 300
        - asset: assets/fonts/SourceSans3-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 700
        - asset: assets/fonts/SourceSans3-ExtraBold.ttf
          weight: 800
    - family: SourceSans3SemiBoldItalic
      fonts:
        - asset: assets/fonts/SourceSans3-SemiBoldItalic.ttf
          weight: 700
    - family: SourceSans3ExtraLightItalic
      fonts:
        - asset: assets/fonts/SourceSans3-ExtraLightItalic.ttf
          weight: 300
    - family: NunitoExtraBoldItalic
      fonts:
        - asset: assets/fonts/Nunito-ExtraBoldItalic.ttf
          weight: 800
    - family: SourceSans3LightItalic
      fonts:
        - asset: assets/fonts/SourceSans3-LightItalic.ttf
          weight: 300
    - family: NunitoExtraLightItalic
      fonts:
        - asset: assets/fonts/Nunito-ExtraLightItalic.ttf
          weight: 300
    - family: SourceSans3MediumItalic
      fonts:
        - asset: assets/fonts/SourceSans3-MediumItalic.ttf
          weight: 500
    - family: SourceSans3Italic
      fonts:
        - asset: assets/fonts/SourceSans3-Italic.ttf
          weight: 400
    - family: NunitoBoldItalic
      fonts:
        - asset: assets/fonts/Nunito-BoldItalic.ttf
          weight: 700
    - family: SourceSans3BoldItalic
      fonts:
        - asset: assets/fonts/SourceSans3-BoldItalic.ttf
          weight: 700
    - family: SourceSans3ExtraBoldItalic
      fonts:
        - asset: assets/fonts/SourceSans3-ExtraBoldItalic.ttf
          weight: 800
    - family: NunitoSemiBoldItalic
      fonts:
        - asset: assets/fonts/Nunito-SemiBoldItalic.ttf
          weight: 700
    - family: NunitoBlackItalic
      fonts:
        - asset: assets/fonts/Nunito-BlackItalic.ttf
          weight: 900
    - family: NunitoItalic
      fonts:
        - asset: assets/fonts/Nunito-Italic.ttf
          weight: 400
    - family: NunitoLightItalic
      fonts:
        - asset: assets/fonts/Nunito-LightItalic.ttf
          weight: 300
    - family: NunitoMediumItalic
      fonts:
        - asset: assets/fonts/Nunito-MediumItalic.ttf
          weight: 500
flutter_native_splash:
  color: "#772583"
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android: true
  android_12:
    color: "#772583"
    icon_background_color: "#772583"
    image: assets/images/splash.png
  ios: true
  image: assets/images/splash.png
