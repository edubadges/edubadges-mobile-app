name: edubadges
description: Edubadges is a digital badge management platform for educational institutions, built on the Open Badges standard.
publish_to: none
version: 1.0.2+4
environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  dartz: ^0.10.1
  flutter_dotenv: ^6.0.0
  go_router: ^17.1.0
  dio: ^5.9.2
  fresh_dio: ^0.4.5
  flutter_svg: ^2.2.4
  flutter_native_splash: ^2.4.7
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_messaging: ^16.4.0
  flutter_piwikpro: ^2.1.1
  device_info_plus: ^12.3.0
  flutter_riverpod: ^3.3.1
  logger: ^2.6.2
  shared_preferences: ^2.5.4
  flutter_appauth: ^12.0.0
  flutter_secure_storage: ^10.0.0
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  flutter_markdown_plus: ^1.0.7
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  intl: ^0.20.2
  collection: ^1.19.1
  app_settings: ^7.0.0
  flexi_page_view: ^1.0.0
  json_annotation: ^4.11.0
  app_badge_plus: ^1.2.10
  crypto: ^3.0.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_flavorizr: ^2.4.1
  accessibility_radar: ^0.2.1
  build_runner: ^2.6.0
  json_serializable: ^6.13.2

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - .env.dev
    - .env.tst
    - .env.acc
    - .env.prod
    - assets/icons/
    - assets/splash/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#772583"
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  android: true
  android_12:
    color: "#772583"
    icon_background_color: "#772583"
    image: assets/images/splash.png
  ios: true
  image: assets/images/splash.png
