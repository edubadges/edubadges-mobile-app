server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Unversioned Flutter runtime paths: short browser caching (not immutable).
  location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location /assets/ {
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location /icons/ {
    expires 5m;
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
